name: Build LLVM+MLIR (weekly/manual)

on:
  workflow_dispatch:
    inputs:
      llvm_ref:
        description: "llvm-project ref (e.g. main or llvmorg-18.1.8)"
        required: true
        default: main
      build_type:
        description: "CMake build type"
        required: true
        default: Release
  schedule:
    - cron: "0 3 * * 1"   # weekly Monday 03:00 UTC

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      LLVMPROJECT_REPO: https://github.com/llvm/llvm-project.git
      LLVMPROJECT_REF: ${{ github.event.inputs.llvm_ref || 'main' }}
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'Release' }}
      PREFIX: ${{ github.workspace }}/_install
    steps:
      - uses: actions/checkout@v4

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build git \
            clang lld zlib1g-dev libffi-dev libxml2-dev libedit-dev
      - name: Clone llvm-project
        run: |
          git clone --depth 1 --branch "$LLVMPROJECT_REF" "$LLVMPROJECT_REPO" llvm-project
      - name: Configure & build
        run: |
          cmake -S llvm-project/llvm -B _build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DLLVM_ENABLE_PROJECTS="mlir" \
            -DLLVM_TARGETS_TO_BUILD="host" \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_USE_LINKER=lld \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld" \
            -DCMAKE_MODULE_LINKER_FLAGS="-fuse-ld=lld" \
            -DCMAKE_INSTALL_PREFIX="${PREFIX}"
          ninja -C _build -j"$(nproc)" install
      - name: Package artifact
        run: |
          tar -C "${PREFIX}" -czf llvm-mlir-${{ runner.os }}-ubuntu-22.04-${{ env.BUILD_TYPE }}.tar.gz .
          echo "Packed:"
          ls -lh llvm-mlir-*.tar.gz
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llvm-mlir-${{ runner.os }}-ubuntu-22.04-${{ env.BUILD_TYPE }}-${{ env.LLVMPROJECT_REF }}
          path: llvm-mlir-${{ runner.os }}-ubuntu-22.04-${{ env.BUILD_TYPE }}.tar.gz
          retention-days: 30
